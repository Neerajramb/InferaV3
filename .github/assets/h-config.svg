<style>
@font-face{font-family:'NRP';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'NRP';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:italic;font-display:block}

  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2s cubic-bezier(.65,0,.35,1) both; }
  .fade { animation: fade 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .8s cubic-bezier(.3,1.5,.5,1) both; }
  .sway { transform-box: fill-box; transform-origin: 10% 100%; animation: sway 7s ease-in-out infinite alternate; }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  .float { transform-box: fill-box; transform-origin: center; animation: float 6s ease-in-out infinite alternate; }
  .drift1 { animation: drift1 18s ease-in-out infinite alternate; }
  .drift2 { animation: drift2 22s ease-in-out infinite alternate; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes float { from { transform: translateY(-4px) rotate(-1deg); } to { transform: translateY(5px) rotate(1.5deg); } }
  @keyframes drift1 { to { transform: translate(40px, 18px); } }
  @keyframes drift2 { to { transform: translate(-36px, -14px); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .draw { stroke-dashoffset: 0; }
  }

  .num { font: 400 24px 'NRP','Playfair Display',Didot,Georgia,serif; fill: #C4553B; }
  .tt { font: italic 400 50px 'NRP','Playfair Display',Didot,Georgia,serif; fill: #2B2622; }
  .slide { animation: slide 1.1s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes slide { from { opacity: 0; transform: translateX(-24px) rotate(-1deg); } to { opacity: 1; transform: none; } }

</style>
